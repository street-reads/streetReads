<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/7e5d9f596b.js" crossorigin="anonymous" defer></script>

    <!-- TomTom Maps SDK -->
    <link rel="stylesheet" type="text/css" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">
    <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

    <!-- JS -->
    <script src="../js/homepage.js"></script>

    <!-- CSS -->
     <link rel="stylesheet" href="../css/homepage.css">
    <title>Homepage</title>
</head>
<body>
    <header>
        <h1>Street Reads</h1>
        <div class="header-button">
            <img src="https://picsum.photos/100/100?random=$" alt="">
        </div>
    </header>
    <main>
        <h2 id="name"></h2>
        <div class="searchbar">
            <p>Discover little Free libraries around you</p>
            <div class="search-field">
                <div class="search">
                    <input class="search-text" type="text" >
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <button id="filterBtn" class="filterBtn"><i class="fa-solid fa-filter"> Filter</i></button>
                    
                    <!-- filter feild - moved inside .search -->
                    <div id="filterFeild" class="filter-feild">
                        <div class="filter-top">
                            <h3>Filters</h3>
                            <div class="filter-top-buttons">
                                <button class="select-all" id="selectAll">Select all</button>
                                <button class="deselect-all" id="deselectAll">Deselect all</button>
                            </div>
                        </div>

                        <div class="check-list">
                            <label for="recently-updated">
                                <input type="checkbox" name="filters" value="recently-updated" id="recently-updated">
                                Recently updated
                            </label>
                            <label for="nearby">
                                <input type="checkbox" name="filters" value="nearby" id="nearby">
                                nearby
                            </label>
                            <label for="most-popular">
                                <input type="checkbox" name="filters" value="most-popular" id="most-popular">
                                Most Popular
                            </label>
                            <label for="most-liked">
                                <input type="checkbox" name="filters" value="most-liked" id="most-liked">
                                Most Liked
                            </label>
                            <label for="most-commented">
                                <input type="checkbox" name="filters" value="most-commented" id="most-commented">
                                Most Commented
                            </label>
                            <label for="new">
                                <input type="checkbox" name="filters" value="new" id="new">
                                New
                            </label>
                        </div>
                        
                        <div class="filter-bottom-buttons">
                            <button class="close-filter" id="closeFilter">Close</button>
                            <button class="update-filter" id="updateFilter">Update</button>
                        </div>
                    </div>
                </div>

                
                 <div class="addBox" id="addBox">
                    <button type="submit">Add BookBox</button>
                </div>
            </div>
        </div>


        <div class="map">
            <div id="map" class="map"></div>
        </div>

<!-- Backdrop -->
<div id="modalBackdrop" class="sr-backdrop" hidden></div>

<!-- Add Book Box Modal -->
<div id="addBookbox" class="sr-modal" role="dialog" aria-modal="true" aria-labelledby="srModalTitle" hidden>
    <div class="sr-card">
        <div class="sr-card-head">
            <h3 id="srModalTitle">Add a Book Box</h3>
            <button class="sr-close" id="srClose" aria-label="Close modal">&times;</button>
        </div>

        <div class="sr-card-body">
            <label class="sr-field">
                <span class="sr-label">BookBox Name</span>
                <input type="text" id="boxName" class="sr-input" placeholder="e.g., Cedar Grove Little Library">
            </label>

            <label class="sr-field">
                <span class="sr-label">Address</span>
                <div class="sr-input-row">
                    <input type="text" id="address" class="sr-input" placeholder="Type an address or use my location">
                    <button type="button" id="useLocation" class="sr-pill">
                        <i class="fa-solid fa-location-arrow"></i> Use my location
                    </button>
                </div>
            </label>

            <div class="sr-field">
                <span class="sr-label">Pictures</span>

                <!-- Upload from gallery/files (multi) -->
                <input type="file" id="picture" accept="image/*" multiple>

                <!-- Use device camera (single shot each time you tap) -->
                <label class="sr-pill as-label" for="cameraCapture">
                    <i class="fa-solid fa-camera"></i> Take a picture
                </label>
                <input id="cameraCapture" type="file" accept="image/*" capture="environment" hidden>

                <!-- Previews + chips -->
                <div id="srPreview" class="sr-preview"></div>
                <div id="srChips" class="sr-chips"></div>
            </div>
        </div>

        <div class="sr-card-foot">
            <button class="cancel" id="cancel">Cancel</button>
            <button class="add-bookbox-submit" id="addBookboxSubmit">Add Box</button>
        </div>
    </div>
</div>
    </main>
</body>
</html>
