<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../css/user-profile.css" />
      <script src="../components/navbar.js" type="module"></script>
</head>

<body>

  <!-- Header like screenshot -->
  <app-navbar brand="Street Reads" href="/" avatar="/images/me.jpg">
        <a slot="nav" href="/explore">Explore</a>
        <a slot="nav" href="/favorites">Favorites</a>
        <button slot="actions" class="pill" onclick="location.href='/add'">Add BookBox</button>
    </app-navbar>

  <main class="layout">
    <!-- LEFT: Profile Card -->
    <section class="card profile-card">
      <div class="profile-head">
        <div class="photo-wrap">
          <img id="profile-photo" class="photo" src="https://i.pravatar.cc/160?img=12" alt="Profile photo" />
          <button class="icon-btn edit"><i class="fa-solid fa-pen"></i></button>
        </div>

        <div class="identity">
          <h2 class="display-name" id="display-name">Luigi</h2>
          <div class="muted small">
            <span id="number-of-post">10</span> Reviews
          </div>
        </div>
      </div>

      <div class="info-table">
        <div class="row">
          <div class="label">Name</div>
          <div class="value display-name">Luigi</div>
        </div>
        <div class="row">
          <div class="label">Email</div>
          <div class="value" id="email">Luigi@gmail.com</div>
        </div>
        <div class="row">
          <div class="label">Location</div>
          <div class="value" id="current-location">West End,<br />Vancouver</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="privacy">
        <h3 class="section-title">Privacy &amp; Security</h3>

        <div class="row">
          <div class="label">Password</div>
          <div class="value password-wrap">
            <span id="password">••••••</span>
            <button class="icon-btn" id="toggle-eye" aria-label="Toggle password">
              <i class="fa-solid fa-eye"></i>
              <i class="fa-solid fa-eye-slash"></i>
            </button>
          </div>
        </div>

        <div class="row">
          <div class="label">Delete Account</div>
          <div class="value">
            <button class="icon-btn danger" title="Delete" id="trash-icon">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="logout">
        <button class="btn" id="log-out-btn">Log out</button>
      </div>
    </section>

    <!-- RIGHT: Favourites -->
    <section class="card panel">
      <h2 class="panel-title">My Favourite Book Boxes</h2>

      <!-- scroll area of favourite cards, your JS fills #favorite-box-info -->
      <div class="grid-scroll" id="favorite-box-info">
        <!-- JS inserts .mini-card blocks here -->
        <!-- Example (kept for reference):
        <div class="mini-card">
          <div class="thumb"></div>
          <div class="meta">
            <div class="name">Book Box 1</div>
            <div class="muted small"><i class="fa-solid fa-location-dot"></i>&nbsp;Location</div>
          </div>
        </div>
        -->
      </div>
    </section>

    <!-- RIGHT: Contributions -->
    <section class="card panel">
      <h2 class="panel-title">My Contributions</h2>

      <div class="stats">
        <div class="stat">
          <div class="big" id="added-box">14</div>
          <div class="muted">Added Boxes</div>
        </div>
        <div class="stat">
          <div class="big" id="review-number">10</div>
          <div class="muted">Reviews</div>
        </div>
      </div>

      <h3 class="sub-title">Added Boxes</h3>
      <!-- scroll area; your JS fills #added-box-info -->
      <div class="grid-scroll" id="added-box-info">
        <!-- JS inserts .mini-card blocks (see CSS below) -->
      </div>
    </section>
  </main>

  <script type="module" src="../js/user-profile.js"></script>
</body>

</html>
