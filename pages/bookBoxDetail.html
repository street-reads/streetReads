<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookBox Detail</title>
    <script src="../js/bookBoxDetail.js" defer></script>
    <link rel="stylesheet" href="../css/bookBoxDetail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <h1>Street Reads</h1>
    </header>

    <main>
        <div class="left">
            <!-- BOOK BOX -->
            <div class="boxDetail">
                <div class="info">
                    <h2 id="boxName">Loading</h2>
                    <p id="boxAddress"></p>
                </div>
                <div class="fav">
                    <p>Add to Favorites</p>
                    <span class="fa-solid fa-heart"></span>
                </div>
            </div>
            <div class="imgContainer">
                <div class="images" id="boxImages"> <img src="https://picsum.photos/300/400?random=1" alt=""> <img
                        src="https://picsum.photos/300/400?random=2" alt=""> <img
                        src="https://picsum.photos/300/400?random=3" alt=""> <img
                        src="https://picsum.photos/300/400?random=4" alt=""> <img
                        src="https://picsum.photos/300/400?random=5" alt=""> <img
                        src="https://picsum.photos/300/400?random=6" alt=""> <img
                        src="https://picsum.photos/300/400?random=7" alt=""> <img
                        src="https://picsum.photos/300/400?random=8" alt=""> <img
                        src="https://picsum.photos/300/400?random=9" alt=""> <img
                        src="https://picsum.photos/300/400?random=10" alt=""> <img
                        src="https://picsum.photos/300/400?random=11" alt=""> </div>
            </div>
            <p class="viewMorePosition">View more</p>
            <div class="btnContainer">
                <button class="btn">Add a Picture</button>
            </div>

            <!-- RATING -->
            <div class="rateBox">
                <p>Rate This BookBox</p>
                <div class="rateContainer">
                    <div class="stars" id="rateAvg"> <i class="fa-solid fa-star"></i> <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i> <i class="fa-solid fa-star"></i> <i
                            class="fa-solid fa-star"></i> </div> <button class="btn btn-open">Add a Review</button>
                </div>
            </div>
            <!-- POP UP -->
            <section class="modal hidden">
                <div class="flex">
                    <button class="btn-close">⨉</button>
                </div>
                <label for="review">Add a Review </label>
                <textarea id="review"></textarea>
                <div class="btnContainer">
                    <button class="btn">Save</button>
                </div>
            </section>
            <div class="overlay hidden"></div>
            <!-- <button class="btn btn-open">Add a Review</button> -->
            <!-- REVIEW BOX -->
            <div class="reviewContainer">
                <div id="reviews"></div>
            </div>
        </div>

        <div class="right">
            <!-- LEAVE MESSAGES -->
            <div class="msgContainer">
                <div id="messages"></div>
                <p>What People are saying</p>
            </div>
        </div>
    </main>
</body>

</html>
